; Sid Meier's Pirates! Couch Co-op mod - settings (read when the game starts)

[Coop]
; 1 = co-op on, 0 = only Xbox controller support
Enabled=1
; co-op starts when the fleet has at least 2 ships (1) or always when 2 controllers are connected (0)
RequireTwoShips=1
; how long notifications stay on screen
NotificationSeconds=20
; SELECT (BACK) passes control in duels and town menus: 0 = a tap passes; e.g. 900 = must hold it 0.9 s (never sent to the game)
HoldBackMs=0
; 1 = Player 2 points the stick where his ship should go, 0 = Xbox style (left/right turns)
Player2PointToSteer=1
; 1 = getting pushed back in a sword fight passes the sword automatically (0 = only by tapping SELECT)
AutoPassOnMistake=0

[Babysit]
; Player 2 is free everywhere. Hands off the stick = his ship keeps its own course. His ship is brought back to
; Player 1 only after this many seconds without touching the stick (0 = never), or when it goes off screen.
IdleSecondsBeforeReturn=20
; Player 2 is completely free while his ship is ON the screen.
; When it goes OFF the screen (100 = exactly the screen edge) the babysitter turns it toward Player 1
; and keeps up with him, until it is back on screen (BackOnScreenPercent of the way from the centre).
OffScreenPercent=102
BackOnScreenPercent=75
; Player 2's ship speed compared to Player 1 (percent), and when being brought back
Player2SpeedPercent=115
CatchUpSpeedPercent=170
; only used when the camera can't be read (other screens): distance before bringing him back
NoCameraSailLeash=2500000
NoCameraBattleLeash=2000000

[Sailing]
; sailing against the wind with FULL sails: your ships (sailing and sea battles) never go slower than this percent of
; their best speed (100 = full speed in every direction). Reduced sails = the game's normal speed rules.
; 0 = the game's own rules always
UpwindSpeedPercent=100
; 1 = sails DOWN (reduced) = full speed on every heading, whatever the wind; FULL sails = the game's own wind
;       rules (fast with the wind, slow into it). 0 = use UpwindSpeedPercent with full sails instead
ReducedSailsFullSpeed=1
; 1 = a ship of yours that sits still on land for 4 s (speed > 0) is pushed the way it points (steer to open sea)
UnstickFromLand=1
; 1 = Player 2's ship stops at the coast like Player 1's (no sailing into the jungle); if it is stuck on land
;       it is moved to open water next to Player 1
Player2StaysOffLand=1

[Display]
; screen resolution forced at start (0 = use the game's own Config.ini setting)
Width=1920
Height=1080
; 1 = wider view at sea (sailing and sea battles). Towns, cut-scenes and duels always use the game's own view
;     (their sets are built for 4:3; a wider view would show past their edges)
WidescreenFOV=1
; 2 = every menu/screen/HUD is shown whole (the game's full 4:3 layout, nothing cut off, nothing stretched) and the
;     extra width of the TV shows the scene behind it. 1 = only the Crew Signups / ship-name pages. 0 = the game's
;     own widescreen (top and bottom of menus and the HUD cut off)
Fit2D=2
; 1 = full-width 2D backgrounds are continued into the sides of the TV (no bars). Movies and the map behind the
;     menus are zoomed to fill instead (like the game's own widescreen)
ExtendBackgrounds=1
; how many 640x480 units of a background's edge are repeated into the sides
EdgeBand=28
; 1 = no black cinematic bars in the in-game cut-scenes (bartender, captains, story scenes). Pre-rendered movies keep theirs.
HideLetterbox=1
; 1 = scenes the game draws with a fixed 4:3 camera (tavern, bartender, captains, towns, sea) are not stretched sideways
NoStretch4x3Cameras=1
; 1 = also turn the game's blue clear colour black (normally not needed)
BlackSideBars=0
; old experiment, not needed - keep 0
TradeScreenWideButtons=0
; 1 = screens with 3D buttons (merchant/plunder arrows, ship choice) use the same unstretched middle area as
;       the text, so the arrows sit next to the numbers instead of on top of "tons"
FitButtonScreens=1
; 1 = on the merchant/plunder screen each goods picture sits in the gap LEFT of its price (not under the text)
TradeIconsLeftOfPrice=1
; world map sides of the TV: 1 = plain map paper, 0 = mirrored copies of the map's edge
MapSides=1

[Controller]
; in a tavern the highlight starts on the crew (recruit men) when a controller is used, so A works at once
TavernStartsOnCrew=1
; 1 = in land battles the D-pad moves the army (8 directions, diagonals with two arrows), no A needed;
;       the camera stays where it is (camera = sticks)
LandBattleDpadMovesArmy=1
Rumble=1
; hide the mouse cursor while a controller is being used (moving the mouse shows it again)
HideMouseWithPad=1
; on-screen keyboard for typing names with the controller
OnScreenKeyboard=1
; menus start with the first choice highlighted when a controller is used (A = accept)
MenuStartsOnFirstChoice=1
; D-pad left = zoom out, D-pad right = zoom in, while sailing and in sea battles
DpadZoom=1
ZoomRepeatMs=90
; 1 = while any controller is connected the game ignores the mouse completely (no map drifting, menus keep the
;     controller highlight, on-screen keyboard always shows). 0 = moving the mouse switches back to mouse play
IgnoreMouseWithPad=1

[Debug]
; 1 = write extra details to PiratesCoop.log
Verbose=0

[ModMenu]
; RB + D-pad UP opens the mod menu in game (either player). These are also changed from the menu and saved here.
; ship speed of your ships (sailing and sea battles): 1, 2 or 3
ShipSpeed=1
; 1 = the crew is always happy (never demands dividing the plunder, no deserters)
CrewAlwaysHappy=0
; 1 = Player 2 ramming the enemy flagship in a sea battle starts the boarding + sword fight (like Player 1 ramming)
Player2RamStartsSwordFight=1
; 1 = your fame is always at least MaxFameValue points
MaxFame=0
MaxFameValue=100
; 1 = Spain, England, France and Holland are kept friendly (checked every second)
FriendlyNations=0
; 1 = your captain never gets dizzy in sword fights (the game does that whenever the "Advantage" bar is below the middle)
NeverDizzyInSwordFights=1
; 1 = sword fights are Player 1 vs Player 2: the player holding the sword is your captain, the other player
;       plays the enemy captain (SELECT swaps). Also in the mod menu.
DuelEachOther=0

[Battle]
; HOLD D-pad UP in a sea battle = the camera slowly rises, up to this percent of the game's farthest view.
; HOLD D-pad DOWN = slowly back down to the game's normal height. It stays where you let go.
FarZoomPercent=200
; how fast: percent of that whole range per second (35 = about 3 seconds from bottom to top)
ZoomSpeedPercentPerSecond=35
; changing sails (Y) takes at most this many frames (~30 per second). The game alone can take 10+ s with a small crew.
SailChangeMaxFrames=30
; 1 = both players can ALWAYS fire; the other player's ship never blocks a shot
AlwaysFire=1
; 1 = Player 1's X (or B) changes the shot type directly, like Player 2 (the game used to drop the press
;       when A was pressed just before). 0 = the game's own key
Player1ShotTypeByMod=1
; 1 = Player 2's ramming only starts the boarding when the two ships really touch (the game's own collision test)
RamNeedsContact=1
; 1 = after ramming, the enemy only surrenders when its hull is below 10 % (90 % damage); otherwise always a
;       sword fight. 0 = the game's own (random) surrender rule
SurrenderOnlyBelow10Percent=1
